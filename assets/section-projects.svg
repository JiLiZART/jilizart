<svg xmlns="http://www.w3.org/2000/svg" width="880" height="72" viewBox="0 0 880 72">
  <foreignObject width="880" height="72">
    <div xmlns="http://www.w3.org/1999/xhtml" class="sec">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .sec { width: 880px; display: flex; flex-direction: column; gap: 10px;
          font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        .top { display: flex; align-items: center; gap: 10px; }
        .num { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; color: #b0b0b5; }
        .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: #6e6e73; }
        .rule { flex: 1 1 auto; height: 1px; background: #e5e5ea; }
        h2 { font-size: 32px; font-weight: 700; letter-spacing: -1.1px; color: #1d1d1f; }
        @media (prefers-color-scheme: dark) {
          .num { color: #6e7681; } .eyebrow { color: #a1a1a6; }
          .rule { background: #30363d; } h2 { color: #f5f5f7; }
        }
      </style>
      <div class="top">
        <span class="num">01</span>
        <span class="eyebrow">OPEN SOURCE</span>
        <span class="rule"></span>
      </div>
      <h2>A few things I've made.</h2>
    </div>
  </foreignObject>
</svg>
