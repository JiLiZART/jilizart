<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96">
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d1d1f; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; fill: #6e6e73; }
    .title { font-size: 36px; font-weight: 700; letter-spacing: -.035em; }
