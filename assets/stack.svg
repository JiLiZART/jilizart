<svg xmlns="http://www.w3.org/2000/svg" width="840" height="146" viewBox="0 0 840 146">
  <foreignObject width="840" height="146">
    <div xmlns="http://www.w3.org/1999/xhtml" class="row">
      <style>
        * { box-sizing: border-box; margin: 0; }
        .row {
          display: grid; grid-template-columns: 1.45fr 1.2fr 1fr; gap: 12px; width: 840px; height: 146px;
          font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          -webkit-font-smoothing: antialiased;
        }
        .card { border-radius: 22px; border: 1px solid #e5e5ea; background: #f5f5f7; padding: 18px 18px; }
        .label { font-size: 11.5px; color: #6e6e73; margin-bottom: 12px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chips span { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 99px; color: #fff; white-space: nowrap; }
        .d { color: #1d1d1f !important; }
      </style>
      <div class="card">
        <div class="label">Languages &amp; Frameworks</div>
        <div class="chips">
          <span class="d" style="background:#f7df1e">JavaScript</span><span style="background:#3178c6">TypeScript</span><span style="background:#149eca">React</span><span style="background:#000">Next</span><span style="background:#764abc">Redux</span><span style="background:#42b883">Vue</span><span class="d" style="background:#00dc82">Nuxt</span><span style="background:#ff3e00">Svelte</span><span style="background:#5fa04e">Node</span><span class="d" style="background:#fbf0df">Bun</span><span style="background:#000">Express</span><span style="background:#000">Fastify</span><span style="background:#b7410e">Rust</span>
        </div>
      </div>
      <div class="card">
        <div class="label">Styling, Testing &amp; Build</div>
        <div class="chips">
          <span style="background:#06b6d4">TailwindCSS</span><span style="background:#db7093">Styled</span><span style="background:#cc6699">Sass</span><span style="background:#c21325">Jest</span><span class="d" style="background:#8dd6f9">Webpack</span><span style="background:#646cff">Vite</span><span style="background:#f69220">PNPM</span><span style="background:#cb3837">NPM</span><span style="background:#2c8ebb">Yarn</span><span style="background:#f05032">Git</span><span class="d" style="background:#ffc131">Tauri</span>
        </div>
      </div>
      <div class="card">
        <div class="label">Infrastructure &amp; DevOps</div>
        <div class="chips">
          <span style="background:#2496ed">Docker</span><span style="background:#009639">Nginx</span><span style="background:#fc6d26">Gitlab CI</span><span style="background:#2088ff">Github Actions</span><span style="background:#000">Vercel</span><span style="background:#000">GNU/Linux</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
